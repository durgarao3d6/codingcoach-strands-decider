# Amazon Bedrock AgentCore features for CodingCoach.
# `./kit deploy` adds what is enabled to deploy/agentcore/agentcore.json.

memory:
  enabled: false   # could pair with #context-memory to remember progress across sessions
  name: agentmemory
  strategies: [SEMANTIC, USER_PREFERENCE]
  expiry_days: 30

gateway:
  enabled: false
  name: tools
  authorizer: AWS_IAM
  targets:
    - name: websearch
      type: connector
      connector: web-search
